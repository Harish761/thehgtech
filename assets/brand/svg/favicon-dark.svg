<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

  <defs>
    <linearGradient id="whitePillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E2E6"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="redDiagGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D72228"/>
      <stop offset="60%" stop-color="#E5242A"/>
      <stop offset="100%" stop-color="#ED2830"/>
    </linearGradient>
    <linearGradient id="redGGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D72228"/>
      <stop offset="100%" stop-color="#E5242A"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#111116"/>
  <rect width="128" height="128" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Monogram centered: 82x99 -> 65.6x79.2 (scale 0.8), offset x=31.2, y=24.4 -->
  <g transform="translate(31.2, 24.4) scale(0.8)">

    <!-- 1. Left Pillar of H -->
    <polygon points="0,24 2,23 2,76 0,75" fill="#9E9EA4"/>
    <polygon points="2,23 15,16 15,82 2,76" fill="url(#whitePillarGrad)"/>

    <!-- 2. Middle Pillar Upper -->
    <polygon points="28,7 30,6 30,31 28,32" fill="#9E9EA4"/>
    <polygon points="30,6 41,0 41,25 30,31" fill="url(#whitePillarGrad)"/>

    <!-- 3. Middle Pillar Lower -->
    <polygon points="28,62 30,61 30,92 28,93" fill="#9E9EA4"/>
    <polygon points="30,61 41,55 41,98 30,92" fill="url(#whitePillarGrad)"/>

    <!-- 4. Red Diagonal Crossbar -->
    <polygon points="41,32 81,10 81,13 41,35" fill="#7A1418"/>
    <polygon points="20,44 41,32 81,10 81,24 41,46 20,52" fill="url(#redDiagGrad)"/>

    <!-- 5. Red G -->
    <polygon points="56,53 81,39 81,42 56,56" fill="#711217"/>
    <path d="M 56,55 
             L 81,42 
             L 81,75 
             L 48,93 
             L 48,80 
             L 68,70 
             L 68,62 
             L 56,69 
             Z" 
          fill="url(#redGGrad)"/>
  </g>
</svg>
