<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" width="560" height="110" fill="none">
  <defs>
    <linearGradient id="darkPillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="redDiagGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C91B21"/>
      <stop offset="60%" stop-color="#DA2228"/>
      <stop offset="100%" stop-color="#E5242A"/>
    </linearGradient>
    <linearGradient id="redGGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C91B21"/>
      <stop offset="100%" stop-color="#DA2228"/>
    </linearGradient>
  </defs>

  <!-- 3D Monogram for Light Surface -->
  <g id="monogram-light" transform="translate(5, 5)">
    <!-- 1. Left Pillar of H -->
    <polygon points="0,24 2,23 2,76 0,75" fill="#475569"/>
    <polygon points="2,23 15,16 15,82 2,76" fill="url(#darkPillarGrad)"/>

    <!-- 2. Middle Pillar Upper -->
    <polygon points="28,7 30,6 30,31 28,32" fill="#475569"/>
    <polygon points="30,6 41,0 41,25 30,31" fill="url(#darkPillarGrad)"/>

    <!-- 3. Middle Pillar Lower -->
    <polygon points="28,62 30,61 30,92 28,93" fill="#475569"/>
    <polygon points="30,61 41,55 41,98 30,92" fill="url(#darkPillarGrad)"/>

    <!-- 4. Red Diagonal Crossbar -->
    <polygon points="41,32 81,10 81,13 41,35" fill="#7A1418"/>
    <polygon points="20,44 41,32 81,10 81,24 41,46 20,52" fill="url(#redDiagGradLight)"/>

    <!-- 5. Red G -->
    <polygon points="56,53 81,39 81,42 56,56" fill="#711217"/>
    <path d="M 56,55 L 81,42 L 81,75 L 48,93 L 48,80 L 68,70 L 68,62 L 56,69 Z" fill="url(#redGGradLight)"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="112" y1="12" x2="112" y2="98" stroke="rgba(15,23,42,0.22)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wordmark: TheHGTech -->
  <text x="136" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.025em">
    <tspan fill="#0F172A">The</tspan><tspan fill="#DA2228">HG</tspan><tspan fill="#0F172A">Tech</tspan>
  </text>

  <!-- Approved Tagline -->
  <text x="138" y="92" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.14em" fill="#475569">
    CYBERSECURITY INSIGHTS | TOOLS | INTELLIGENCE
  </text>
</svg>
