    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --accent-cyan: #00D9FF;
            --accent-red: #FF3D3D;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
        }

        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 1.5rem 120px;
        }

        .article-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .article-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-cyan), #FF3D3D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .article-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .article-content h2 {
            color: var(--accent-cyan);
            margin: 2rem 0 1rem;
            font-size: 1.5rem;
        }

        .article-content h3 {
            color: var(--text-primary);
            margin: 1.5rem 0 0.75rem;
            font-size: 1.25rem;
        }

        .article-content p {
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
        }

        .article-content ul,
        .article-content ol {
            color: var(--text-secondary);
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .article-content li {
            margin-bottom: 0.5rem;
        }

        .article-content strong {
            color: var(--text-primary);
        }

        .article-content a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .article-content a:hover {
            text-decoration: underline;
        }

        .article-content blockquote {
            border-left: 4px solid var(--accent-cyan);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .article-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Monaco', monospace;
            font-size: 0.9em;
        }

        .article-content pre {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .article-content pre code {
            background: none;
            padding: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .article-header h1 {
                font-size: 1.5rem;
            }

            .article-content h2 {
                font-size: 1.3rem;
            }

            .article-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Light mode */
        .light-mode body {
            background: #fff;
            color: #1a1a1a;
        }

        .light-mode .article-content p {
            color: #555;
        }

        .light-mode .article-header h1 {
            background: linear-gradient(135deg, #0077aa, #c41e3a);
            -webkit-background-clip: text;
        }
    </style>

                document.body.classList.add("light-mode");
            }
        })();
    </script>
