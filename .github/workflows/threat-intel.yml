name: RSS Threat Intel Update

on:
  schedule:
    - cron: '5 */4 * * *'    # Every 4 hours at :05 UTC
    - cron: '35 18 * * *'    # Daily at 00:05 IST (generates daily summary)
  workflow_dispatch:         # Manual trigger option

concurrency:
  group: main-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 pyyaml openai

      - name: Run RSS Threat Intel Fetcher
        id: fetch_ioc
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/legacy_tasks/fetch_threat_intel.py --both

      - name: Sync Vendor IOC Files
        id: sync_ioc
        run: |
          mkdir -p ioc-data
          for vendor_file in \
            openphish.json \
            malware-bazaar.json \
            spamhaus-drop.json \
            cins-army.json \
            blocklist-de.json \
            urlhaus.json \
            threatfox.json \
            feodo-tracker.json \
            ssl-blacklist.json; do
            if [ -f "$vendor_file" ]; then
              mv -f "$vendor_file" "ioc-data/$vendor_file"
            fi
          done
          ls -lh ioc-data/

      - name: Run AI Security Data Fetcher
        id: fetch_ai
        env:
          AIID_API_TOKEN: ${{ secrets.AIID_API_TOKEN }}
        run: python3 scripts/legacy_tasks/fetch_ai_security.py --output ioc-data

      - name: Enrich CVE Data (Dual Source - CISA KEV + NVD Critical)
        id: enrich_cve
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/legacy_tasks/enrich_cve_dual_source.py

      - name: Enrich CVE Data with EPSS Scores
        id: enrich_epss
        continue-on-error: true  # Non-blocking - workflow continues if EPSS API fails
        run: |
          echo "📊 Adding EPSS (Exploit Prediction) scores..."
          python3 scripts/legacy_tasks/enrich_epss.py

      - name: Log Usage Statistics
        id: usage_log
        continue-on-error: true
        run: |
          mkdir -p data
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts/legacy_tasks')
          from monitor_github_actions import log_workflow_run
          usage = log_workflow_run('threat-intel', duration_seconds=180)
          print(f\"📊 Monthly usage: {usage['totalMinutes']:.1f}/{usage['limit']} minutes ({usage['usagePercent']}%)\")
          "

      - name: Validate Pipeline & Header Integrity
        id: validate
        run: |
          python3 -m unittest tests/test_threat_intel_pipeline.py
          test -s threat-intel.js || (echo "Error: threat-intel.js is empty or missing!" && exit 1)
          test -s cve-data.json || (echo "Error: cve-data.json is empty or missing!" && exit 1)

      - name: Commit & Push All Changes
        id: commit
        run: |
          bash scripts/git_safe_commit.sh \
            --name "github-actions[bot]" \
            --email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "🛡️ Threat Intel update [$(date -u '+%Y-%m-%d %H:%M')] UTC" \
            -- \
            threat-intel.js \
            threat-intel-history.json \
            threat-intel-history.js \
            ti-snapshot.html \
            ioc-data/ \
            cve-data.json \
            data/github-actions-usage.json

      - name: Workflow Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          FETCH_IOC: ${{ steps.fetch_ioc.outcome }}
          FETCH_AI: ${{ steps.fetch_ai.outcome }}
          ENRICH_CVE: ${{ steps.enrich_cve.outcome }}
          ENRICH_EPSS: ${{ steps.enrich_epss.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Threat Intel Update Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Threat Intel Update Failed (status: $JOB_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **IOC Fetch:** \`$FETCH_IOC\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AI Security Fetch:** \`$FETCH_AI\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CVE Enrichment (CISA KEV + NVD):** \`$ENRICH_CVE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **EPSS Enrichment (optional):** \`$ENRICH_EPSS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pipeline Validation:** \`$VALIDATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit & Push:** \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cve-data.json ]; then
            CVE_COUNT=$(python3 -c "import json; d=json.load(open('cve-data.json')); print(d.get('totalCVEs', len(d.get('cves', []))))" 2>/dev/null || echo "unknown")
            echo "- **Total CVEs Tracked:** $CVE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          fi
