name: Build Articles & CVE Map

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - '!articles/page/**'
      - 'guides/**'
      - 'comparisons/**'
      - 'ioc-data/articles.json'
      - 'scripts/generate_pagination.py'
      - 'scripts/generate_cve_map.py'
      - 'scripts/generate_sitemaps_and_rss.py'
  schedule:
    # Run daily at 03:00 UTC to prune Google News sitemap entries older than 48h
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Pagination
        run: python scripts/generate_pagination.py

      - name: Generate CVE Cross-Link Map
        run: python scripts/generate_cve_map.py

      - name: Generate Sitemaps and RSS
        run: python scripts/generate_sitemaps_and_rss.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.html index.html articles/page/ data/cve-mentions.json sitemap.xml news-sitemap.xml rss.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-build static articles and CVE map"
            git pull --rebase origin main && git push
          fi
