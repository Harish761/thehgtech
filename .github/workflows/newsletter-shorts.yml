name: Send Newsletter (Shorts Digest)

on:
  workflow_run:
    workflows: ["Update TheHGTech Shorts"]
    types:
      - completed
  
  # Allow manual trigger
  workflow_dispatch:

# Required to commit the CVE daily-lock state file back to the repo
permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
      
      - name: Send Shorts Newsletter via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python scripts/send_newsletter.py --type shorts
      
      - name: Commit CVE daily-lock state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/newsletter-cve-state.json || true
          git diff --staged --quiet || \
            git commit -m "chore: update newsletter CVE lock [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main && git push || true
      
      - name: Summary
        if: always()
        run: |
          echo "### Newsletter Sent: Daily Digest" >> $GITHUB_STEP_SUMMARY
          echo "Dispatched shorts digest (with CVE section) to Brevo API." >> $GITHUB_STEP_SUMMARY
