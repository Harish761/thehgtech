name: Send Newsletter (Shorts Digest)

on:
  workflow_run:
    workflows: ["Update TheHGTech Shorts"]
    types:
      - completed
  
  # Allow manual trigger with verification
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-send even if content hash was already delivered'
        required: false
        default: false
        type: boolean

# Prevent concurrent newsletter delivery runs
concurrency:
  group: newsletter-shorts
  cancel-in-progress: false

# Required to commit the state files back to the repo
permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    # Send newsletter when Update TheHGTech Shorts completes successfully (schedule or manual), or on direct manual dispatch with verification
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
      
      - name: Send Shorts Newsletter via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          UPSTREAM_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/send_newsletter.py --type shorts --force
          else
            python scripts/send_newsletter.py --type shorts
          fi
      
      - name: Commit and push newsletter state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/newsletter-cve-state.json data/newsletter-shorts-state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update newsletter state [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                echo "✅ Successfully pushed newsletter state to main"
                break
              fi
              echo "⚠️ Push failed (attempt $i/5), retrying in 3s..."
              sleep 3
            done
            if [ "$pushed" != "true" ]; then
              echo "❌ CRITICAL: Failed to push newsletter state to main after 5 attempts."
              exit 1
            fi
          else
            echo "ℹ️ No changes in newsletter state to commit."
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "### Newsletter Execution: Daily Digest" >> $GITHUB_STEP_SUMMARY
          echo "Dispatched shorts digest (with CVE section) to Brevo API or handled idempotently." >> $GITHUB_STEP_SUMMARY
