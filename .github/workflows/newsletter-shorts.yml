name: Send Newsletter (Shorts Digest)

on:
  workflow_run:
    workflows: ["Update TheHGTech Shorts"]
    types:
      - completed
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
      
      - name: Send Shorts Newsletter via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python scripts/send_newsletter.py --type shorts
      
      - name: Summary
        if: always()
        run: |
          echo "### 📧 Newsletter Sent: Daily Digest" >> $GITHUB_STEP_SUMMARY
          echo "Dispatched shorts digest to Brevo API." >> $GITHUB_STEP_SUMMARY
