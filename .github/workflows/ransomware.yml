name: Update Ransomware Data

on:
  schedule:
    # Run twice daily at 00:12 and 12:12 UTC (jittered off :00 and threat-intel at :05)
    - cron: '12 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: main-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-ransomware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ransomware data
        id: fetch_ransomware
        run: python3 scripts/legacy_tasks/fetch_ransomware.py

      - name: Commit changes
        id: commit
        run: |
          bash scripts/git_safe_commit.sh \
            --name "github-actions[bot]" \
            --email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "🔐 Update ransomware data - $(date -u '+%Y-%m-%d %H:%M UTC')" \
            -- \
            ransomware-data.json

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          FETCH_OUTCOME: ${{ steps.fetch_ransomware.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Ransomware Data Update Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Ransomware Data Update Failed (status: $JOB_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source:** Ransomware.live API" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Fetch:** \`$FETCH_OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit & Push:** \`$COMMIT_OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"
