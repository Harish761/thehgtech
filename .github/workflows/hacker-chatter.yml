name: Update Hacker Chatter Data

on:
  schedule:
    # Run twice daily (every 12 hours at 02:30 and 14:30 UTC)
    - cron: '30 2,14 * * *'
  workflow_dispatch:

concurrency:
  group: main-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-hacker-chatter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch recent incidents
        id: fetch_chatter
        run: python3 scripts/update_hacker_chatter.py

      - name: Fetch HIBP verified breaches
        id: fetch_hibp
        run: python3 scripts/fetch_hibp_data.py

      - name: Validate Hacker Chatter Archive & Preview
        id: validate_chatter
        run: |
          python3 -c "
          import json, os
          src = json.load(open('data/hacker-chatter.json', encoding='utf-8'))
          prv_path = 'data/hacker-chatter-recent.json'
          prv_size = os.path.getsize(prv_path)
          prv = json.load(open(prv_path, encoding='utf-8'))
          assert prv_size < 51200, f'Preview exceeds 50 KB: {prv_size} bytes'
          assert len(src.get('incidents', [])) >= len(prv.get('incidents', [])) > 0
          assert prv.get('total_incidents') == len(src.get('incidents', []))
          print(f'✅ Validated archive ({len(src[\"incidents\"])} incidents) and preview ({len(prv[\"incidents\"])} incidents, {prv_size/1024:.1f} KB)')
          "

      - name: Commit changes
        id: commit
        run: |
          bash scripts/git_safe_commit.sh \
            --name "github-actions[bot]" \
            --email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "🕵️ Update Hacker Chatter & HIBP DB - $(date -u '+%Y-%m-%d %H:%M UTC')" \
            -- \
            data/hacker-chatter.json \
            data/hacker-chatter-recent.json \
            ioc-data/verified-breaches.json

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHATTER_OUTCOME: ${{ steps.fetch_chatter.outcome }}
          HIBP_OUTCOME: ${{ steps.fetch_hibp.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_chatter.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Hacker Chatter Sync Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Hacker Chatter Sync Failed (status: $JOB_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **OSINT Fetch:** \`$CHATTER_OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **HIBP Fetch:** \`$HIBP_OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Payload Validation:** \`$VALIDATE_OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit & Push:** \`$COMMIT_OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"
